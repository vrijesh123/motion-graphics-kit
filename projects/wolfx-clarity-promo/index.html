<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!--
      WOLFx "Clarity first" promo, 1080x1920, 30 fps, 25 s. Text-only (no voice-over), timed to a 120 bpm grid
      (beat 0.5 s, bar 2 s). Copy and shot list: script.md (Draft 2). Brand: clients/wolfx/brand.md.
      Scene starts = "cut" cues in cues.json: 0, 2, 4, 8, 10.5, 12.5, 15, 17.5, 20.
      Word data-t = the second the word starts to land. Red (#FF2B2B) is used once per scene at most.
    -->
    <style>
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      :root { --bg: #FFFFFF; --ink: #121212; --soft: #ECECEC; --accent: #FF2B2B; --mute: #909090; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Poppins", sans-serif; color: var(--ink); background: var(--bg); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .stage, .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
      svg { overflow: visible; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      /* captions: small lead-in line over one big key line */
      .capbox { position: absolute; left: 60px; right: 60px; text-align: center; }
      .lead { font-size: 64px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; }
      .keyb { font-size: 132px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.0; margin-top: 6px; }
      .w { display: inline-block; white-space: nowrap; }
      .red { color: var(--accent); }
      .mk { position: relative; display: inline-block; white-space: nowrap; }
      .strike { position: absolute; left: -0.04em; right: -0.04em; top: 0.47em; height: 0.085em; background: var(--accent); transform-origin: 0 50%; }

      /* plate (persistent, paints over every scene) */
      #plate .badge { position: absolute; left: 50%; top: 186px; width: 88px; height: 88px; margin-left: -44px; border: 3px solid var(--ink); background: var(--bg); }
      #plate .badge img { position: absolute; left: 6px; top: 6px; width: 70px; height: 70px; object-fit: contain; }

      /* scenes */
      #s1 .stage { transform-origin: 540px 940px; }
      #s2 .stage { transform-origin: 540px 940px; }
      #s2 .dip { position: absolute; inset: 0; background: var(--ink); opacity: 0; }
      #s3 { background: var(--ink); }
      #s3 .capbox { color: var(--bg); }
      #s3 .cam, #s4 .cam, #s5 .stage { transform-origin: 540px 1080px; }
      #s4 .stage { background: var(--bg); }
      #s5 .cam { transform-origin: 540px 1080px; }
      #s6 .stage, #s6 .cam { transform-origin: 540px 1000px; }
      #s7 .cam, #s8 .cam { transform-origin: 540px 960px; }
      #s8 .stage { transform-origin: 540px 920px; }
      .pill { position: absolute; height: 168px; display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 700; letter-spacing: -0.02em; }
      .pill svg { position: absolute; left: 0; top: 0; }
      .pill span { position: relative; }

      /* end card */
      #end .wm { position: absolute; left: 260px; top: 470px; width: 560px; height: 350px; }
      #end .brule { position: absolute; left: 440px; top: 872px; width: 200px; height: 6px; background: var(--accent); transform-origin: 50% 50%; }
      #end .tag { position: absolute; left: 60px; right: 60px; top: 922px; text-align: center; font-size: 76px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.12; }
      #end .btn { position: absolute; left: 330px; top: 1172px; width: 420px; height: 112px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 48px; font-weight: 600; letter-spacing: -0.01em; }
      #end .btn svg { width: 46px; height: 30px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">

      <!-- S1 0-2: "Most tech projects / don't fail" over a browser window typing code (out: push in on the window) -->
      <section id="s1" class="clip" data-start="0" data-duration="2.1" data-track-index="0"><div class="stage"><div class="cam">
        <div class="capbox" style="top:340px">
          <div class="lead"><span class="w" data-t="0">Most</span> <span class="w" data-t="0">tech</span> <span class="w" data-t="0">projects</span></div>
          <div class="keyb"><span class="w" data-t="0.85">don’t</span> <span class="w" data-t="1">fail</span></div>
        </div>
        <svg class="win" viewBox="0 0 780 600" style="position:absolute; left:150px; top:640px; width:780px; height:600px"></svg>
      </div></div></section>

      <!-- S2 2-4: "because of / bad code." + red strike-through at 3.0 (out: dip, hard cut to black) -->
      <section id="s2" class="clip" data-start="2" data-duration="2" data-track-index="0"><div class="stage"><div class="cam">
        <svg class="win" viewBox="0 0 780 600" data-layout-allow-overflow style="position:absolute; left:-396px; top:220px; width:1872px; height:1440px"></svg>
        <div class="capbox" style="top:780px" data-layout-allow-overlap>
          <div class="lead"><span class="w" data-t="2.15">because</span> <span class="w" data-t="2.32">of</span></div>
          <div class="keyb"><span class="mk"><span class="w" data-t="2.5">bad</span> <span class="w" data-t="2.65">code.</span><span class="strike"></span></span></div>
        </div>
        <div class="dip"></div>
      </div></div></section>

      <!-- S3 4-8 (black): "They fail because nobody was clear on / the problem." A white line tangles into a knot.
           Set-piece at 8.0: the knot pulls straight, then a white iris opens from the full stop (scene 4) -->
      <section id="s3" class="clip" data-start="4" data-duration="4.6" data-track-index="0"><div class="stage"><div class="cam">
        <svg class="full" viewBox="0 0 1080 1920" data-layout-allow-overflow><path id="knot" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
        <div class="capbox" style="top:330px">
          <div class="lead"><span class="w" data-t="4.2">They</span> <span class="w" data-t="4.38">fail</span> <span class="w" data-t="4.56">because</span> <span class="w" data-t="4.78">nobody</span> <span class="w" data-t="4.98">was</span> <span class="w" data-t="5.16">clear</span> <span class="w" data-t="5.34">on</span></div>
          <div class="keyb red"><span class="w" data-t="5.85">the</span> <span class="w" data-t="6">problem.</span></div>
        </div>
      </div></div></section>

      <!-- S4 8-10.5: "At WOLFx, we start with / clarity." The straight line is a calm horizon (out: slide left) -->
      <section id="s4" class="clip" data-start="8" data-duration="2.9" data-track-index="0"><div class="stage"><div class="cam">
        <svg class="full" viewBox="0 0 1080 1920" data-layout-allow-overflow>
          <line x1="-40" y1="1080" x2="1120" y2="1080" stroke="#121212" stroke-width="4"/>
          <g class="ticks"></g>
        </svg>
        <div class="capbox" style="top:640px">
          <div class="lead"><span class="w" data-t="8.3">At</span> <span class="w" data-t="8.46">WOLFx,</span> <span class="w" data-t="8.62">we</span> <span class="w" data-t="8.78">start</span> <span class="w" data-t="8.94">with</span></div>
          <div class="keyb red"><span class="w" data-t="9.5">clarity.</span></div>
        </div>
      </div></div></section>

      <!-- S5 10.5-12.5: "We sit down / with you," two speech bubbles take turns either side of the line (out: zoom through) -->
      <section id="s5" class="clip" data-start="10.5" data-duration="2" data-track-index="0"><div class="stage"><div class="cam">
        <svg class="full bubbles" viewBox="0 0 1080 1920" data-layout-allow-overflow>
          <line x1="-40" y1="1080" x2="1120" y2="1080" stroke="#121212" stroke-width="4"/>
        </svg>
        <div class="capbox" style="top:400px">
          <div class="lead"><span class="w" data-t="10.7">We</span> <span class="w" data-t="10.86">sit</span> <span class="w" data-t="11">down</span></div>
          <div class="keyb"><span class="w" data-t="11.3">with</span> <span class="w" data-t="11.5">you,</span></div>
        </div>
      </div></div></section>

      <!-- S6 12.5-15: "map out what your / business needs," a dashed route crosses a contour map to a red pin (out: push up) -->
      <section id="s6" class="clip" data-start="12.5" data-duration="2.5" data-track-index="0"><div class="stage"><div class="cam">
        <svg class="full topo" viewBox="0 0 1080 1920" data-layout-allow-overflow></svg>
        <div class="capbox" style="top:330px">
          <div class="lead"><span class="w" data-t="12.65">map</span> <span class="w" data-t="12.8">out</span> <span class="w" data-t="12.95">what</span> <span class="w" data-t="13.1">your</span></div>
          <div class="keyb"><span class="w" data-t="13.35">business</span> <span class="w" data-t="13.5">needs,</span></div>
        </div>
      </div></div></section>

      <!-- S7 15-17.5: "and only then / design and build it," placeholders snap into solid UI blocks (out: hard cut) -->
      <section id="s7" class="clip" data-start="15" data-duration="2.5" data-track-index="0"><div class="stage"><div class="cam">
        <svg class="full wire" viewBox="0 0 1080 1920" data-layout-allow-overflow></svg>
        <div class="capbox" style="top:330px">
          <div class="lead"><span class="w" data-t="15.2">and</span> <span class="w" data-t="15.36">only</span> <span class="w" data-t="15.52">then</span></div>
          <div class="keyb"><span class="w" data-t="15.8">design</span> <span class="w" data-t="15.92">and</span> <span class="w" data-t="16">build</span> <span class="w" data-t="16.12">it,</span></div>
        </div>
      </div></div></section>

      <!-- S8 17.5-20: three red-outlined service pills on the beats (out: set-piece, pills fly to centre) -->
      <section id="s8" class="clip" data-start="17.5" data-duration="2.55" data-track-index="0"><div class="stage"><div class="cam">
        <div class="pill p0" style="left:237px; top:596px; width:606px"><svg width="606" height="168"><rect x="2.5" y="2.5" width="601" height="163" rx="81.5" fill="none" stroke="#FF2B2B" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><span>Websites</span></div>
        <div class="pill p1" style="left:335px; top:836px; width:410px"><svg width="410" height="168"><rect x="2.5" y="2.5" width="405" height="163" rx="81.5" fill="none" stroke="#FF2B2B" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><span>Apps</span></div>
        <div class="pill p2" style="left:400px; top:1076px; width:280px"><svg width="280" height="168"><rect x="2.5" y="2.5" width="275" height="163" rx="81.5" fill="none" stroke="#FF2B2B" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg><span>AI</span></div>
      </div></div></section>

      <!-- END 20-25: wordmark, red rule, closing line, wolfx.io button. Held to the end -->
      <section id="end" class="clip" data-start="20" data-duration="5" data-track-index="0"><div class="stage">
        <img class="wm" src="assets/wolfx-wordmark-black-interim.png" alt="WOLFx" />
        <div class="brule"></div>
        <div class="tag"><span class="w" data-t="20.55">Let’s</span> <span class="w" data-t="20.7">make</span> <span class="w" data-t="20.85">something</span> <span class="w" data-t="21.05">great</span> <span class="w" data-t="21.25">together.</span></div>
        <div class="btn"><span>wolfx.io</span><svg viewBox="0 0 46 30"><path class="arr" d="M2 15 H40 M28 3 L41 15 L28 27" fill="none" stroke="#FFFFFF" stroke-width="4"/></svg></div>
      </div></section>

      <!-- persistent plate: faint grid, contour lines drifting in the bottom-right corner, "Wx" badge top centre -->
      <div id="plate" class="clip" data-start="0" data-duration="25" data-track-index="2">
        <svg class="full grid" viewBox="0 0 1080 1920" data-layout-allow-overflow></svg>
        <svg class="full topo" viewBox="0 0 1080 1920" data-layout-allow-overflow></svg>
        <div id="badge" class="badge"><img src="assets/wolfx-monogram-wx.png" alt="" /></div>
      </div>
      <!-- soundtrack from tools/make_audio.py (reads cues.json); run npm run audio after any timing change -->
      <audio id="mix" src="assets/audio.wav" data-start="0" data-duration="25" data-volume="1" data-track-index="1"></audio>
    </div>

    <script>
      const css = getComputedStyle(document.documentElement);
      const C = (n) => css.getPropertyValue(n).trim();
      const BG = C("--bg"), INK = C("--ink"), SOFT = C("--soft"), ACC = C("--accent"), MUTE = C("--mute");
      const q = (s) => document.querySelector(s), qa = (s) => document.querySelectorAll(s);
      const f1 = (v) => v.toFixed(1);
      const polyD = (pts, close) => "M" + pts.map((p) => f1(p[0]) + " " + f1(p[1])).join(" L") + (close ? " Z" : "");

      // ---------- shapes (all deterministic) ----------
      // code window: hairline browser frame + grey "code" rows (abstract bars, not text)
      const ROWS = [[0, [96, 170]], [1, [130, 210]], [1, [70, 250]], [2, [190]], [2, [110, 150]], [1, [60]], [0, []],
                    [0, [150, 96]], [1, [230, 120]], [1, [170]], [2, [140, 80]], [0, [54]]];
      const rowEnd = [];
      function codeWindow(svg) {
        let s = `<rect x="0" y="0" width="780" height="600" fill="${BG}" stroke="${INK}" stroke-width="4"/>
          <line x1="0" y1="64" x2="780" y2="64" stroke="${INK}" stroke-width="3"/>
          ${[34, 64, 94].map((x) => `<circle cx="${x}" cy="32" r="9" fill="none" stroke="${INK}" stroke-width="3"/>`).join("")}
          <rect x="140" y="18" width="480" height="28" fill="none" stroke="${MUTE}" stroke-width="2"/>`;
        ROWS.forEach(([ind, segs], i) => {
          const y = 96 + i * 38;
          s += `<g class="row r${i}"><rect x="24" y="${y}" width="22" height="14" fill="${SOFT}"/>`;
          let x = 70 + ind * 40;
          segs.forEach((w, j) => { s += `<rect class="seg" x="${x}" y="${y}" width="${w}" height="14" rx="3" fill="${j % 2 ? "#D2D2D2" : "#9C9C9C"}"/>`; x += w + 16; });
          rowEnd[i] = [segs.length ? x - 8 : 70 + ind * 40, y - 5];
          s += `</g>`;
        });
        s += `<rect class="cursor" x="0" y="0" width="10" height="24" fill="${INK}"/>`;
        svg.innerHTML = s;
      }
      codeWindow(q("#s1 .win"));
      codeWindow(q("#s2 .win"));

      // S3 knot: one line enters from the left and keeps looping back on itself; LINE has the same point count
      const KN = 520, KNOT = [], LINE = [];
      for (let i = 0; i < KN; i++) {
        const u = i / (KN - 1);
        let x, y;
        if (u <= 0.14) { const a = u / 0.14; x = -60 + a * 390; y = 1080 + 14 * Math.sin(a * Math.PI * 2); }
        else {
          const v = (u - 0.14) / 0.86, th = v * Math.PI * 2 * 5.5, R = 40 + 220 * Math.pow(v, 0.7);
          const cx = 370 + 190 * v, cy = 1080 - 30 * v;
          x = cx - R * Math.cos(th) + 0.38 * R * v * Math.cos(2.7 * th + 1.1);
          y = cy - 0.8 * R * Math.sin(th) + 0.3 * R * v * Math.sin(1.9 * th + 0.4);
        }
        KNOT.push([x, y]);
        LINE.push([-60 + u * 1200, 1080]);
      }
      const KNOT_D = polyD(KNOT), LINE_D = polyD(LINE);
      q("#knot").setAttribute("d", KNOT_D);

      // S4 ruler ticks under the horizon
      q("#s4 .ticks").innerHTML = (() => {
        let s = "";
        for (let x = 0; x <= 1080; x += 54) s += `<line class="tk" data-x="${x}" x1="${x}" y1="1092" x2="${x}" y2="${x % 216 === 0 ? 1124 : 1108}" stroke="${MUTE}" stroke-width="3"/>`;
        return s;
      })();

      // S5 speech bubbles (square corners, hairline) with typing dots
      q("#s5 .bubbles").insertAdjacentHTML("beforeend", `
        <g class="bub bl"><path d="M110 780 H500 V960 H200 L140 1018 L156 960 H110 Z" fill="${BG}" stroke="${INK}" stroke-width="4" stroke-linejoin="miter"/>
          <g class="dots">${[265, 305, 345].map((x) => `<circle cx="${x}" cy="870" r="11" fill="${INK}"/>`).join("")}</g>
          <g class="msg"><rect x="150" y="826" width="300" height="20" fill="${MUTE}"/><rect x="150" y="870" width="210" height="20" fill="${MUTE}"/><rect x="150" y="914" width="120" height="20" fill="${MUTE}"/></g></g>
        <g class="bub br"><path d="M580 1150 H880 L936 1098 L924 1150 H970 V1310 H580 Z" fill="${BG}" stroke="${INK}" stroke-width="4" stroke-linejoin="miter"/>
          <g class="dots">${[735, 775, 815].map((x) => `<circle cx="${x}" cy="1230" r="11" fill="${INK}"/>`).join("")}</g></g>`);

      // S6 topographic map: two hills of nested contours + flowing lines, a dashed route and a red pin
      function blob(cx, cy, R, ys, ph, n = 180) {
        const pts = [];
        for (let k = 0; k < n; k++) {
          const t = (k / n) * Math.PI * 2;
          const r = R * (1 + 0.13 * Math.sin(3 * t + ph) + 0.07 * Math.sin(5 * t + 1.7 * ph) + 0.05 * Math.cos(2 * t + 0.6 * ph));
          pts.push([cx + r * Math.cos(t), cy + ys * r * Math.sin(t)]);
        }
        return polyD(pts, true);
      }
      q("#s6 .topo").innerHTML = (() => {
        let s = `<g fill="none" stroke="${MUTE}" stroke-width="2.5">`;
        for (let l = 0; l < 6; l++) s += `<path class="ct" pathLength="1" stroke-dasharray="1" d="${blob(700 - l * 10, 1040 + l * 8, 46 + l * 46, 0.82, 0.6 + l * 0.35)}"/>`;
        for (let l = 0; l < 4; l++) s += `<path class="ct" pathLength="1" stroke-dasharray="1" d="${blob(130 - l * 6, 1520 + l * 10, 60 + l * 52, 0.8, 2.1 + l * 0.3)}"/>`;
        for (let l = 0; l < 5; l++) {
          const y0 = 1500 + l * 70;
          s += `<path class="ct" pathLength="1" stroke-dasharray="1" d="M 560 ${1960} C ${640 + l * 30} ${y0 + 160}, ${760 + l * 20} ${y0 - 40}, ${1120} ${y0 - 120 + l * 10}"/>`;
        }
        s += `</g>
          <defs><mask id="routeMask" maskUnits="userSpaceOnUse" x="-100" y="0" width="1300" height="1920">
            <path class="rmask" d="M 40 1700 C 180 1650, 300 1560, 360 1440 S 420 1260, 540 1210 S 660 1130, 700 1052" fill="none" stroke="#fff" stroke-width="20" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></mask></defs>
          <path d="M 40 1700 C 180 1650, 300 1560, 360 1440 S 420 1260, 540 1210 S 660 1130, 700 1052" fill="none" stroke="${INK}" stroke-width="6" stroke-dasharray="18 14" mask="url(#routeMask)"/>
          <circle class="ping ping0" cx="700" cy="1050" r="12" fill="none" stroke="${ACC}" stroke-width="4" opacity="0"/><circle class="ping ping1" cx="700" cy="1050" r="12" fill="none" stroke="${ACC}" stroke-width="4" opacity="0"/>
          <g transform="translate(660 940)"><g class="pin"><path d="M40 110 C40 110 4 66 4 40 A36 36 0 1 1 76 40 C76 66 40 110 40 110 Z" fill="${ACC}"/><circle cx="40" cy="40" r="13" fill="${BG}"/></g></g>`;
        return s;
      })();

      // S7 browser + phone wireframes; grey dashed placeholders that snap into solid UI blocks
      const PH = `fill="#F3F3F3" stroke="#C4C4C4" stroke-width="2.5" stroke-dasharray="10 8"`;
      q("#s7 .wire").innerHTML = `
        <rect x="90" y="800" width="560" height="400" fill="${BG}" stroke="${INK}" stroke-width="4"/>
        <line x1="90" y1="846" x2="650" y2="846" stroke="${INK}" stroke-width="3"/>
        ${[114, 138, 162].map((x) => `<circle cx="${x}" cy="823" r="7" fill="none" stroke="${INK}" stroke-width="3"/>`).join("")}
        <rect class="blk b1 fill" x="114" y="866" width="512" height="36" ${PH}/>
        <rect class="blk b2 fill" x="114" y="920" width="300" height="160" ${PH}/>
        <rect class="blk b3 card" x="430" y="920" width="196" height="72" ${PH}/>
        <rect class="blk b4 card" x="430" y="1008" width="196" height="72" ${PH}/>
        <rect class="blk b5 fill" x="114" y="1100" width="512" height="22" ${PH}/>
        <rect class="blk b6 fill" x="114" y="1140" width="360" height="22" ${PH}/>
        <rect x="690" y="740" width="300" height="560" rx="40" fill="${BG}" stroke="${INK}" stroke-width="4"/>
        <rect x="800" y="760" width="80" height="16" rx="8" fill="${INK}"/>
        <rect class="blk p1 fill" x="714" y="800" width="252" height="150" ${PH}/>
        <rect class="blk p2 fill" x="714" y="970" width="252" height="24" ${PH}/>
        <rect class="blk p3 fill" x="714" y="1008" width="180" height="24" ${PH}/>
        <rect class="blk p4 card" x="714" y="1050" width="252" height="110" ${PH}/>
        <rect class="blk p5 fill" x="714" y="1186" width="252" height="80" ${PH}/>
        <path class="arrow" d="M 806 1226 H 872 M 852 1207 L 873 1226 L 852 1245" fill="none" stroke="${BG}" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`;

      // plate: faint grid (mid grey at low opacity reads on white and, faintly, on black) + corner contour lines
      q("#plate .grid").innerHTML = (() => {
        let s = "";
        for (let x = 0; x <= 1080; x += 108) s += `<line x1="${x}" y1="-120" x2="${x}" y2="2040"/>`;
        for (let y = -108; y <= 2052; y += 108) s += `<line x1="0" y1="${y}" x2="1080" y2="${y}"/>`;
        return `<g stroke="#8C8C8C" stroke-opacity="0.17" stroke-width="2">${s}</g>`;
      })();
      q("#plate .topo").innerHTML = (() => {
        let s = `<g fill="none" stroke="${MUTE}" stroke-width="2.2">`;
        for (let l = 0; l < 7; l++) {
          const x0 = 420 + l * 42, y1 = 1500 + l * 58;
          s += `<path d="M ${x0} 1990 C ${x0 + 90} ${1830 - l * 10}, ${700 + l * 18} ${y1 + 70}, ${820 + l * 10} ${y1 - 10} S ${1020} ${y1 - 120 + l * 6}, ${1160} ${y1 - 150 + l * 14}"/>`;
        }
        return s + `</g>`;
      })();

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      // draw-on: tween the attribute, not the CSS property (CSSPlugin rounds px, which turns a 0..1 offset into a jump)
      const draw = (el, t, dur, ease = "power2.inOut") => tl.fromTo(el, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease }, t);

      // caption words: blur 8 -> 0, y +10 -> 0, 0.14 s, hard ease-out. Colour is set in CSS per word (ink, white or red).
      qa(".w[data-t]").forEach((w) => {
        const t = +w.dataset.t;
        if (t <= 0) return; // already on screen at frame 0 (the hook)
        tl.fromTo(w, { opacity: 0, y: 10, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, t);
      });

      // ---- S1 0-2: code types in, one row at a time; cursor follows, then blinks ----
      const s1 = q("#s1 .win"), cur1 = s1.querySelector(".cursor");
      tl.set(cur1, { attr: { x: rowEnd[2][0], y: rowEnd[2][1] } }, 0);
      for (let k = 3; k < ROWS.length; k++) {
        const t = 0.1 + (k - 3) * 0.17;
        const segs = s1.querySelectorAll(".r" + k + " .seg");
        segs.forEach((seg, j) => tl.fromTo(seg, { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.1, ease: "steps(4)" }, t + j * 0.07));
        tl.set(cur1, { attr: { x: rowEnd[k][0], y: rowEnd[k][1] } }, t + Math.max(0, segs.length - 1) * 0.07 + 0.1);
      }
      tl.fromTo(cur1, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "steps(1)", yoyo: true, repeat: 1 }, 1.62);
      // out: push in on the window (accelerates into the cut at 2.0)
      tl.fromTo("#s1 .stage", { scale: 1, filter: "blur(0px)" }, { scale: 2.6, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 1.8);

      // ---- S2 2-4: the window fills the frame; red strike through "bad code." on beat 3.0 ----
      const cur2 = q("#s2 .win .cursor");
      tl.set(cur2, { attr: { x: rowEnd[11][0], y: rowEnd[11][1] } }, 0);
      tl.fromTo(cur2, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: 5 }, 2.4);
      tl.fromTo("#s2 .stage", { scale: 1.083, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 2.0);
      tl.fromTo("#s2 .win", { opacity: 1 }, { opacity: 0.4, duration: 0.5, ease: "power2.out" }, 2.05);
      tl.fromTo("#s2 .strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 3.0);
      tl.fromTo("#s2 .cam", { scale: 1 }, { scale: 1.025, duration: 1.9, ease: "none" }, 2.0);
      tl.fromTo("#s2 .dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, 3.9);   // out: dip, then hard cut to black

      // ---- S3 4-8 (black): the line tangles while the words build; pulls straight into 8.0 ----
      draw(q("#knot"), 4.05, 3.3, "power1.inOut");
      tl.fromTo("#knot", { attr: { d: KNOT_D } }, { attr: { d: LINE_D }, duration: 0.55, ease: "power3.inOut" }, 7.45);
      tl.fromTo("#s3 .cam", { scale: 1 }, { scale: 1.03, duration: 4.0, ease: "none" }, 4.0);
      tl.set("#badge", { filter: "invert(1)" }, 4.0);   // black/white flip of the badge on the black scene

      // ---- S4 8-10.5: white iris from the full stop after "problem."; ruler ticks draw out from the centre ----
      const IRIS = "930px 583px";
      tl.fromTo("#s4 .stage", { clipPath: `circle(0px at ${IRIS})` }, { clipPath: `circle(2300px at ${IRIS})`, duration: 0.45, ease: "power2.in" }, 8.0);
      tl.set("#badge", { filter: "invert(0)" }, 8.25);
      [...qa("#s4 .tk")].sort((a, b) => Math.abs(a.dataset.x - 540) - Math.abs(b.dataset.x - 540)).forEach((tk, i) =>
        tl.fromTo(tk, { scaleY: 0 }, { scaleY: 1, transformOrigin: "50% 0%", duration: 0.3, ease: "expo.out" }, 8.6 + Math.floor((i + 1) / 2) * 0.1));
      tl.fromTo("#s4 .cam", { scale: 1 }, { scale: 1.025, duration: 2.5, ease: "none" }, 8.0);
      // out: slide left; scene 5 slides in carrying the same line
      tl.fromTo("#s4 .stage", { x: 0 }, { x: -1080, duration: 0.35, ease: "power3.inOut" }, 10.5);
      tl.fromTo("#s5 .stage", { x: 1080 }, { x: 0, duration: 0.35, ease: "power3.inOut" }, 10.5);

      // ---- S5 10.5-12.5: bubbles take turns ----
      const typing = (sel, t0, cycles) => qa(sel).forEach((d, i) =>
        tl.fromTo(d, { y: 0 }, { y: -12, duration: 0.17, ease: "sine.inOut", yoyo: true, repeat: cycles * 2 - 1 }, t0 + i * 0.1));
      tl.fromTo("#s5 .bl", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, svgOrigin: "140 1018", duration: 0.35, ease: "expo.out" }, 10.85);
      tl.fromTo("#s5 .bl .msg", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 11.4);
      tl.fromTo("#s5 .bl .dots", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power2.out" }, 11.35);
      typing("#s5 .bl .dots circle", 10.95, 1);
      tl.fromTo("#s5 .bl .msg rect", { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.25, ease: "expo.out", stagger: 0.08 }, 11.4);
      tl.fromTo("#s5 .br", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, svgOrigin: "936 1098", duration: 0.35, ease: "expo.out" }, 11.35);
      typing("#s5 .br .dots circle", 11.5, 2);
      tl.fromTo("#s5 .cam", { scale: 1 }, { scale: 1.03, duration: 1.8, ease: "none" }, 10.5);
      // out: zoom through the gap between the bubbles
      tl.fromTo("#s5 .stage", { scale: 1, filter: "blur(0px)", opacity: 1 }, { scale: 3.2, filter: "blur(12px)", opacity: 0, duration: 0.2, ease: "power3.in" }, 12.3);

      // ---- S6 12.5-15: map draws on, route walks to the pin ----
      tl.fromTo("#s6 .stage", { scale: 1.35, filter: "blur(12px)", opacity: 0.3 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "expo.out" }, 12.5);
      qa("#s6 .ct").forEach((p, i) => draw(p, 12.25 + i * 0.04, 0.9, "power2.out"));   // starts under the zoom-through so the map is already forming
      draw(q("#s6 .rmask"), 13.0, 0.85, "power2.inOut");
      tl.fromTo("#s6 .pin", { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 13.88);
      [14.05, 14.45].forEach((t, i) => tl.to("#s6 .ping" + i, { keyframes: [{ opacity: 1, duration: 0.02 }, { opacity: 0, attr: { r: 70 }, duration: 0.6, ease: "power2.out" }] }, t));
      tl.fromTo("#s6 .cam", { scale: 1 }, { scale: 1.03, duration: 2.3, ease: "none" }, 12.5);
      // out: push up
      tl.fromTo("#s6 .stage", { y: 0 }, { y: -760, duration: 0.2, ease: "power3.in" }, 14.8);

      // ---- S7 15-17.5: arrives from below; placeholders snap into solid blocks; the last is a black button ----
      tl.fromTo("#s7 .stage", { y: 760, filter: "blur(12px)" }, { y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 15.0);
      const SNAP = [["b1", 15.55], ["p1", 15.75], ["b2", 15.95], ["p2", 16.15], ["p3", 16.25], ["b3", 16.4], ["b4", 16.52], ["p4", 16.7], ["b5", 16.85], ["b6", 16.95], ["p5", 17.1]];
      SNAP.forEach(([id, t]) => {
        const el = q("#s7 ." + id), card = el.classList.contains("card");
        tl.set(el, { attr: { "stroke-dasharray": "none" } }, t);
        tl.fromTo(el, { fill: "#F3F3F3", stroke: "#C4C4C4", strokeWidth: 2.5 }, { fill: card ? BG : INK, stroke: INK, strokeWidth: card ? 4 : 2.5, duration: 0.08, ease: "none" }, t);
        tl.fromTo(el, { scale: 1.05 }, { scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "power3.out" }, t);
      });
      draw(q("#s7 .arrow"), 17.18, 0.25, "power2.out");
      tl.fromTo("#s7 .cam", { scale: 1 }, { scale: 1.025, duration: 2.5, ease: "none" }, 15.0);

      // ---- S8 17.5-20: pills land on the beats, outlines draw on; then fly to centre ----
      [17.42, 18.0, 18.5].forEach((t, i) => {   // on the beats; "Websites" starts just before the hard cut so the cut frame is not empty
        tl.fromTo("#s8 .p" + i, { opacity: 0, scale: 0.86, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, t);
        draw(q("#s8 .p" + i + " rect"), t, 0.45, "power2.out");
      });
      tl.fromTo("#s8 .cam", { scale: 1 }, { scale: 1.03, duration: 2.5, ease: "none" }, 17.5);
      tl.fromTo("#s8 .stage", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 0.15, opacity: 0, filter: "blur(10px)", duration: 0.36, ease: "power3.in" }, 19.68);

      // ---- END 20-25: wordmark lands on the impact, rule draws, line builds, button; arrow nudges in the hold ----
      tl.fromTo("#end .wm", { scale: 1.3, filter: "blur(18px)" }, { scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 20.0);   // lands on the impact, visible from its first frame
      tl.fromTo("#end .brule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 20.35);
      tl.fromTo("#end .btn", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 21.6);
      gsap.set("#end .arr", { x: 0 });
      [22.6, 23.8].forEach((t) => tl.to("#end .arr", { x: 6, duration: 0.22, ease: "power2.inOut", yoyo: true, repeat: 1 }, t));

      // ---- plate: constant small life ----
      tl.fromTo("#plate .grid", { y: 0 }, { y: -108, duration: 25, ease: "none" }, 0);
      tl.fromTo("#plate .topo g", { x: 0, y: 0 }, { x: -70, y: 24, duration: 25, ease: "none" }, 0);
      gsap.set("#plate .topo", { opacity: 1 });
      tl.to("#plate .topo", { opacity: 0, duration: 0.2, ease: "power2.out" }, 12.4);   // scene 6 has its own map
      tl.to("#plate .topo", { opacity: 1, duration: 0.3, ease: "power2.out" }, 15.0);
      tl.fromTo("#badge", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.7, duration: 0.25, ease: "power2.in" }, 19.6);   // the wordmark takes over

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
