<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!--
      STARTER TEMPLATE: 2D motion graphics reel, 1080x1920, 12.5 s, 3 scenes + end card.
      House style taken from refrences/2d-motion-graphics (see SUMMARY.md):
        - captions build word by word on the voice-over (data-t = the second the word is spoken, in VIDEO time)
        - two-tier lock-up: small lead-in line over one big key word (bold sans or italic serif)
        - one visual metaphor per scene, a different short transition per scene (push, zoom-through, iris)
        - persistent "plate" (dashed grid, rotating stars, small logo tile) so the frame is never empty
      To make a real video: copy this folder, set the palette in :root, replace the copy and data-t times
      (python tools/caption_spans.py ...), replace the placeholder shapes, then keep cues.json in sync.
      All placeholder times below are invented (no voice-over yet).
    -->
    <style>
      @font-face { font-family: "Figtree"; src: url("assets/fonts/Figtree.ttf") format("truetype"); font-weight: 300 900; font-display: block; }
      @font-face { font-family: "InstrumentSerifItalic"; src: url("assets/fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-style: italic; font-display: block; }
      /* palette: one background, one ink, one soft tint, at most one accent (change these first) */
      :root { --bg: #F6F4EF; --ink: #141414; --soft: #DCD6C8; --accent: #2F6BFF; --mute: #8A8578; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Figtree", sans-serif; color: var(--ink); background: var(--bg); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .abs { position: absolute; }
      svg { overflow: visible; }

      /* captions */
      .capbox { position: absolute; left: 60px; right: 60px; text-align: center; }
      .lead { font-size: 66px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12; }
      .keyb { font-size: 150px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.0; margin-top: 6px; }
      .key { font-family: "InstrumentSerifItalic", Georgia, serif; font-style: italic; font-weight: 400; font-size: 132px; letter-spacing: -0.015em; line-height: 1.05; margin-top: 8px; }
      .w { display: inline-block; white-space: pre; }
      .ch { display: inline-block; white-space: pre; }
      .mk { position: relative; display: inline-block; white-space: nowrap; z-index: 0; }
      .mk .hl { position: absolute; left: 0.02em; right: -0.04em; bottom: 0.08em; height: 0.36em; background: var(--soft); border-radius: 0.08em; transform-origin: 0 50%; z-index: -1; }
      .lineup { display: block; overflow: hidden; padding: 0.06em 0.04em 0.14em; margin: -0.06em -0.04em -0.14em; }
      .lineup > .in { display: inline-block; }

      /* plate (persistent) */
      #plate svg.grid { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #plate .star { position: absolute; }
      #plate .mini { position: absolute; left: 50%; top: 150px; width: 92px; height: 92px; margin-left: -46px; border-radius: 24px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; letter-spacing: 0.02em; }

      /* S1 hook */
      #s1 .ghost { position: absolute; left: -40px; top: 1080px; font-size: 330px; font-weight: 800; letter-spacing: -0.06em; color: var(--soft); opacity: 0.6; white-space: nowrap; }
      #s1 .capbox { top: 640px; }
      #s1 .big { font-size: 176px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; margin-top: 14px; }
      #s1 .ring { position: absolute; border-radius: 50%; border: 6px solid var(--ink); }

      /* S2 metaphor cards */
      #s2 .capbox { top: 380px; }
      .card { position: absolute; top: 1080px; width: 260px; height: 300px; border-radius: 44px; border: 6px solid var(--ink); background: var(--bg); box-shadow: 12px 12px 0 var(--soft); display: flex; align-items: center; justify-content: center; }
      .card.hero { background: var(--accent); }

      /* S3 dark scene revealed by an iris */
      #s3 { background: var(--ink); color: var(--bg); }
      #s3 .capbox { top: 1240px; }
      #s3 .meter { position: absolute; left: 290px; top: 560px; width: 500px; height: 500px; }

      /* end card */
      #end .tile { position: absolute; left: 50%; top: 600px; width: 240px; height: 240px; margin-left: -120px; border-radius: 58px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 800; letter-spacing: 0.04em; }
      #end .brand { position: absolute; left: 0; right: 0; top: 920px; text-align: center; font-size: 104px; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; }
      #end .brule { position: absolute; left: 50%; top: 1060px; width: 170px; margin-left: -85px; height: 6px; border-radius: 3px; background: var(--accent); }
      #end .tag { position: absolute; left: 0; right: 0; top: 1110px; text-align: center; font-family: "InstrumentSerifItalic", Georgia, serif; font-style: italic; font-size: 78px; }
      #end .contact { position: absolute; left: 0; right: 0; top: 1270px; text-align: center; font-size: 46px; font-weight: 700; line-height: 1.5; }

      #grain { position: absolute; inset: -64px; background: url("assets/grain.png") repeat; opacity: 0.2; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1080" data-height="1920">

      <!-- S1 hook: "Most people scroll past in seconds." (exit: push up) -->
      <section id="s1" class="clip" data-start="0" data-duration="3.25" data-track-index="0"><div class="stage">
        <div class="ghost" data-layout-allow-overflow data-layout-allow-overlap aria-hidden="true">scroll</div>
        <div class="ring r1" style="left:110px; top:470px; width:120px; height:120px"></div>
        <div class="ring r2" style="left:830px; top:1000px; width:84px; height:84px"></div>
        <div class="capbox">
          <div class="lead"><span class="w" data-t="0.3">Most </span><span class="w" data-t="0.52">people </span><span class="w" data-t="0.8">scroll </span><span class="w" data-t="1.05">past</span></div>
          <div class="big">in seconds.</div>
        </div>
      </div></section>

      <!-- S2 metaphor: "Motion gives your idea a reason to stay." (exit: zoom-through) -->
      <section id="s2" class="clip" data-start="3.1" data-duration="3.4" data-track-index="0"><div class="stage">
        <div class="capbox">
          <div class="lead"><span class="w" data-t="3.35">Motion </span><span class="w" data-t="3.62">gives </span><span class="w" data-t="3.85">your </span><span class="w" data-t="4.05">idea</span></div>
          <div class="key"><span class="w" data-t="4.4">a </span><span class="w" data-t="4.55">reason </span><span class="w" data-t="4.9">to </span><span class="mk" data-t="5.1"><span class="hl"></span><span class="w" data-t="5.1">stay.</span></span></div>
        </div>
        <!-- placeholder metaphor: replace the three cards with your own SVG illustration -->
        <div class="card c0" style="left:70px"></div>
        <div class="card c1 hero" style="left:410px; top:1020px"></div>
        <div class="card c2" style="left:750px"></div>
      </div></section>

      <!-- S3 proof, dark scene: "One clear message, told well." (entry: iris, exit: blur) -->
      <section id="s3" class="clip" data-start="6.3" data-duration="3.2" data-track-index="0"><div class="stage">
        <svg class="meter" viewBox="0 0 500 500"></svg>
        <div class="capbox">
          <div class="lead"><span class="w" data-t="6.75">One </span><span class="w" data-t="6.95">clear </span><span class="w" data-t="7.2">message,</span></div>
          <div class="keyb"><span class="w" data-t="7.7">told </span><span class="w" data-t="7.95">well.</span></div>
        </div>
      </div></section>

      <!-- END CARD: replace LOGO / brand / tagline / contact -->
      <section id="end" class="clip" data-start="9.3" data-duration="3.2" data-track-index="0"><div class="stage">
        <div class="tile">LOGO</div>
        <div class="brand">Your brand</div>
        <div class="brule"></div>
        <div class="tag"><span class="lineup"><span class="in">one line that sums it up</span></span></div>
        <div class="contact"><div><span class="lineup"><span class="in">yourbrand.com</span></span></div></div>
      </div></section>

      <!-- persistent plate: dashed grid, two rotating four-point stars, small logo tile top centre -->
      <div id="plate" class="clip" data-start="0" data-duration="12.5" data-track-index="2">
        <svg class="grid" viewBox="0 0 1080 1920"></svg>
        <svg class="star st1" viewBox="0 0 100 100" style="left:60px; top:210px; width:96px; height:96px"></svg>
        <svg class="star st2" viewBox="0 0 100 100" style="left:910px; top:1640px; width:120px; height:120px"></svg>
        <div class="mini">LOGO</div>
      </div>
      <div id="grain" class="clip" data-start="0" data-duration="12.5" data-track-index="3"></div>
      <!-- soundtrack from tools/make_audio.py (reads cues.json); generate it before preview/render -->
      <audio id="mix" src="assets/audio.wav" data-start="0" data-duration="12.5" data-volume="1" data-track-index="1"></audio>
    </div>

    <script>
      const css = getComputedStyle(document.documentElement);
      const C = (n) => css.getPropertyValue(n).trim();
      const BG = C("--bg"), INK = C("--ink"), SOFT = C("--soft"), ACC = C("--accent"), MUTE = C("--mute");
      const q = (s) => document.querySelector(s), qa = (s) => document.querySelectorAll(s);
      const STAR = "M50 0 C55 35 65 45 100 50 C65 55 55 65 50 100 C45 65 35 55 0 50 C35 45 45 35 50 0 Z";

      // ---------- shapes (placeholders) ----------
      q("#s2 .c0").innerHTML = `<svg viewBox="0 0 100 100" width="120" height="120"><circle cx="50" cy="50" r="40" fill="none" stroke="${INK}" stroke-width="8"/></svg>`;
      q("#s2 .c1").innerHTML = `<svg viewBox="0 0 100 100" width="130" height="130"><path d="M50 8 L92 88 H8 Z" fill="${BG}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/></svg>`;
      q("#s2 .c2").innerHTML = `<svg viewBox="0 0 100 100" width="120" height="120"><rect x="12" y="12" width="76" height="76" rx="14" fill="none" stroke="${INK}" stroke-width="8"/></svg>`;
      q("#s3 .meter").innerHTML = `<circle cx="250" cy="250" r="220" fill="none" stroke="${MUTE}" stroke-opacity="0.35" stroke-width="18"/>
        <circle class="arc" cx="250" cy="250" r="220" fill="none" stroke="${ACC}" stroke-width="18" stroke-linecap="round" transform="rotate(-90 250 250)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <path class="chk" d="M160 255 L225 320 L345 190" fill="none" stroke="${BG}" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`;
      q("#plate .grid").innerHTML = (() => {
        let s = "";
        for (let x = 0; x <= 1080; x += 108) s += `<line x1="${x}" y1="0" x2="${x}" y2="1920"/>`;
        for (let y = 0; y <= 1920; y += 108) s += `<line x1="0" y1="${y}" x2="1080" y2="${y}"/>`;
        return `<g stroke="${MUTE}" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="6 10">${s}</g>`;
      })();
      qa("#plate .star").forEach((el) => (el.innerHTML = `<path d="${STAR}" fill="${SOFT}"/>`));

      function splitChars(el) {
        const txt = el.textContent; el.textContent = "";
        [...txt].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; el.appendChild(s); });
      }
      ["#s1 .big", "#end .brand"].forEach((s) => splitChars(q(s)));

      // ---------- timeline ----------
      // Cue times = Whisper word start (file time) + VO offset. Scene changes must equal the "cut" cues in cues.json.
      const tl = gsap.timeline({ paused: true });
      gsap.set(".lineup > .in", { yPercent: 115 });

      // caption words: slide up + blur in a pale colour, then darken to full colour as the word is spoken
      qa(".w[data-t]").forEach((w) => {
        const t = +w.dataset.t, dark = !!w.closest("#s3");
        tl.fromTo(w, { opacity: 0, y: 26, color: dark ? MUTE : SOFT, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, t - 0.12);
        tl.to(w, { color: dark ? BG : INK, duration: 0.3, ease: "power1.out" }, t + 0.06);
      });
      qa(".mk[data-t] .hl").forEach((h) => {
        tl.fromTo(h, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "expo.out" }, +h.parentElement.dataset.t + 0.05);
      });
      const warp = (sel, t, stagger = 0.02) => tl.fromTo(qa(sel), { yPercent: (i) => (i % 2 ? 60 : -60), rotation: (i) => (i % 2 ? 12 : -12), scaleY: 1.6, filter: "blur(10px)", opacity: 0 }, { yPercent: 0, rotation: 0, scaleY: 1, filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "expo.out", stagger }, t);
      const draw = (el, t, dur, ease = "power2.inOut") => tl.fromTo(el, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease }, t);

      // ---- S1 0-3.25 ----
      tl.fromTo("#s1 .ghost", { x: 60 }, { x: -260, duration: 3.25, ease: "none" }, 0);
      tl.fromTo("#s1 .ring", { scale: 0 }, { scale: 1, duration: 0.45, ease: "expo.out", stagger: 0.2 }, 0.2);
      tl.to("#s1 .ring", { y: -14, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.7);
      warp("#s1 .big .ch", 1.35, 0.022);
      tl.fromTo("#s1 .big", { scale: 1 }, { scale: 1.06, duration: 1.6, ease: "power1.out" }, 1.35);
      tl.to("#s1 .stage", { y: -520, opacity: 0, filter: "blur(10px)", duration: 0.24, ease: "power3.in" }, 2.95);   // out: push up

      // ---- S2 3.1-6.5 ----
      tl.fromTo("#s2 .stage", { y: 520, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 3.1);
      tl.fromTo("#s2 .c0", { x: -600, rotation: -12 }, { x: 0, rotation: -6, duration: 0.55, ease: "expo.out" }, 3.5);
      tl.fromTo("#s2 .c2", { x: 600, rotation: 12 }, { x: 0, rotation: 6, duration: 0.55, ease: "expo.out" }, 3.65);
      tl.fromTo("#s2 .c1", { y: 900 }, { y: 0, duration: 0.6, ease: "expo.out" }, 3.8);
      tl.to("#s2 .card", { y: "-=16", duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.15 }, 4.5);
      tl.to("#s2 .stage", { scale: 1.5, opacity: 0, filter: "blur(14px)", duration: 0.24, ease: "power3.in" }, 6.2);  // out: zoom-through

      // ---- S3 6.3-9.5: iris in from the hero card position ----
      tl.fromTo("#s3", { clipPath: "circle(0px at 540px 1200px)" }, { clipPath: "circle(2200px at 540px 1200px)", duration: 0.55, ease: "power3.inOut" }, 6.3);
      draw(q("#s3 .arc"), 6.7, 1.1, "power2.out");
      draw(q("#s3 .chk"), 7.9, 0.35, "power2.out");
      tl.fromTo("#s3 .meter", { scale: 0.85 }, { scale: 1, duration: 2.6, ease: "power1.out", svgOrigin: "250 250" }, 6.5);
      tl.to("#s3 .stage", { opacity: 0, filter: "blur(16px)", duration: 0.25, ease: "power2.in" }, 9.2);          // out: blur

      // ---- END 9.3-12.5 ----
      const E = 9.35;
      tl.fromTo("#end .stage", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, E - 0.05);
      tl.fromTo("#end .tile", { scale: 0, rotation: -14 }, { scale: 1, rotation: 0, duration: 0.5, ease: "expo.out" }, E + 0.05);
      warp("#end .brand .ch", E + 0.4, 0.03);
      tl.fromTo("#end .brule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, E + 0.9);
      qa("#end .tag .in, #end .contact .in").forEach((el, i) => tl.to(el, { yPercent: 0, duration: 0.45, ease: "expo.out" }, E + 0.85 + i * 0.15));

      // ---- plate: constant small life ----
      tl.fromTo("#plate .st1", { rotation: 0 }, { rotation: 180, duration: 12.5, ease: "none" }, 0);
      tl.fromTo("#plate .st2", { rotation: 0 }, { rotation: -180, duration: 12.5, ease: "none" }, 0);
      tl.fromTo("#plate .grid", { y: 0 }, { y: -108, duration: 12.5, ease: "none" }, 0);
      tl.fromTo("#plate .mini", { backgroundColor: INK, color: BG }, { backgroundColor: BG, color: INK, duration: 0.3, ease: "power1.out" }, 6.45); // stays visible on the dark scene
      tl.to("#plate .mini", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, 9.1);
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: 80, y: -54, duration: 12.5, ease: "steps(100)" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
